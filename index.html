<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Ular Sederhana</title>
    <style>
        /* Pengaturan Dasar & Desain */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #113222, #021108); /* Latar bertema hutan/ular gelap */
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Mencegah layar tergeser saat main di HP */
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #4ade80;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .score-container {
            font-size: 20px;
            font-weight: bold;
            background: #1e293b;
            padding: 8px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .header-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .color-settings {
            display: flex;
            gap: 15px;
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #334155;
            border-radius: 50%;
        }

        #score {
            color: #fbbf24;
            font-size: 24px;
        }

        /* Area Game (Canvas & Overlay) */
        #game-wrapper {
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 12px;
            touch-action: none; /* Mencegah default swipe/scroll dari browser */
            display: inline-block; /* Agar membungkus kanvas dengan pas */
        }

        canvas {
            background-color: #1a3320; /* Warna dasar kanvas hijau gelap */
            border: 4px solid #064e3b; /* Border hijau lumut */
            border-radius: 12px;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            backdrop-filter: blur(3px);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .overlay h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        #start-screen h2 { color: #4ade80; }
        #game-over-screen h2 { color: #f87171; }

        .overlay p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover { background-color: #2563eb; }
        .btn:active { transform: scale(0.95); }

        /* Tombol Kontrol untuk HP */
        #mobile-controls {
            display: none;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 12px;
            margin-top: 25px;
            justify-content: center;
        }

        .d-pad-btn {
            background-color: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #1e293b;
        }

        .d-pad-btn:active {
            box-shadow: 0 0 0 #1e293b;
            transform: translateY(4px);
            background-color: #475569;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Mode Responsif untuk Layar Sentuh (Tablet & HP) */
        @media (max-width: 800px) {
            .header-panel {
                flex-direction: column;
                gap: 10px;
                margin-bottom: 10px;
            }
            #mobile-controls { display: grid; }
            h1 { font-size: 24px; margin-top: 10px; margin-bottom: 5px;}
            .score-container { padding: 6px 20px; font-size: 18px; margin-bottom: 10px; }
            #mobile-controls { gap: 8px; margin-top: 10px; }
            .d-pad-btn { font-size: 20px; }
        }
    </style>
</head>
<body>

    <h1>Game Ular Klasik</h1>
    
    <div class="header-panel">
        <div class="score-container">Skor: <span id="score">0</span></div>
        <div class="color-settings">
            <div class="color-picker" title="Ubah Warna Ular">
                🐍 <input type="color" id="snake-color" value="#22c55e">
            </div>
            <div class="color-picker" title="Ubah Warna Buah">
                🍎 <input type="color" id="food-color" value="#ef4444">
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <!-- Area Kanvas Game -->
        <canvas id="gameCanvas"></canvas>

        <!-- Layar Mulai -->
        <div id="start-screen" class="overlay">
            <h2>Siap Bermain?</h2>
            <p>Gunakan tombol panah di Keyboard<br>atau tombol di layar untuk HP.</p>
            <button class="btn" onclick="startGame()">Mulai Game</button>
        </div>

        <!-- Layar Game Over -->
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h2>Game Over!</h2>
            <p>Skor Akhir Anda: <strong id="final-score" style="color: #fbbf24; font-size: 22px;">0</strong></p>
            <button class="btn" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <!-- Tombol Kontrol Layar (Untuk Mobile) -->
    <div id="mobile-controls">
        <button class="d-pad-btn" id="btn-up" onclick="setDirection('UP')">▲</button>
        <button class="d-pad-btn" id="btn-left" onclick="setDirection('LEFT')">◀</button>
        <button class="d-pad-btn" id="btn-down" onclick="setDirection('DOWN')">▼</button>
        <button class="d-pad-btn" id="btn-right" onclick="setDirection('RIGHT')">▶</button>
    </div>

    <script>
        // --- Inisialisasi Kanvas dan Variabel ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20; // Ukuran kotak grid (Ular dan Makanan)
        
        let snake = [];
        let score = 0;
        let foods = []; // Diubah jadi array agar bisa menampung banyak apel
        let dx = gridSize; // Kecepatan arah X (Kanan)
        let dy = 0;        // Kecepatan arah Y
        let gameSpeed = 130;
        let changingDirection = false; // Mencegah bug mundur
        let gameLoopTimeout;

        let snakeColor = '#22c55e';
        let foodColor = '#ef4444';

        // --- Fungsi Mengukur Layar (Responsif) ---
        function resizeCanvas() {
            const isMobile = window.innerWidth <= 800;
            const headerSpace = 160; // Ruang untuk judul dan skor
            const controlSpace = isMobile ? 220 : 40; // Ruang untuk tombol d-pad di HP
            
            let availWidth = window.innerWidth * 0.95;
            let availHeight = window.innerHeight - headerSpace - controlSpace;

            // Batas maksimal ukuran untuk desktop layar lebar
            if (availWidth > 1000) availWidth = 1000;
            if (availHeight > 600) availHeight = 600;

            // Batas minimal
            if (availWidth < 200) availWidth = 200;
            if (availHeight < 200) availHeight = 200;

            // Hitung ukuran kelipatan grid (20px) agar pergerakan ular tidak bug/keluar jalur
            canvas.width = Math.floor(availWidth / gridSize) * gridSize;
            canvas.height = Math.floor(availHeight / gridSize) * gridSize;
            
            // Gambar ulang latar belakang jika game sedang tidak berjalan
            clearCanvas();
        }

        // Pasang pendeteksi perubahan ukuran layar
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Atur ukuran saat pertama kali dimuat

        // --- Listener Perubahan Warna ---
        document.getElementById('snake-color').addEventListener('input', function(e) {
            snakeColor = e.target.value;
        });
        document.getElementById('food-color').addEventListener('input', function(e) {
            foodColor = e.target.value;
        });

        // --- Logika Utama Game ---

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            // Menghitung titik tengah layar dinamis
            const startX = Math.floor((canvas.width / 2) / gridSize) * gridSize;
            const startY = Math.floor((canvas.height / 2) / gridSize) * gridSize;
            
            // Posisi awal ular ditaruh persis di tengah
            snake = [
                {x: startX, y: startY},
                {x: startX - gridSize, y: startY},
                {x: startX - gridSize * 2, y: startY}
            ];
            score = 0;
            foods = []; // Reset keranjang makanan
            dx = gridSize;
            dy = 0;
            gameSpeed = 130;
            changingDirection = false;
            
            document.getElementById('score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'none';
            
            generateFood();
            clearTimeout(gameLoopTimeout);
            mainLoop();
        }

        // Fungsi putaran (loop) game yang berjalan terus menerus
        function mainLoop() {
            if (hasGameEnded()) {
                document.getElementById('game-over-screen').style.display = 'flex';
                document.getElementById('final-score').innerText = score;
                return;
            }

            changingDirection = false;
            
            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                mainLoop();
            }, gameSpeed);
        }

        // --- Fungsi Penggambaran (Render) ---

        function clearCanvas() {
            // Menggambar background papan catur (Checkerboard) khas game ular
            for (let i = 0; i < canvas.width / gridSize; i++) {
                for (let j = 0; j < canvas.height / gridSize; j++) {
                    // Selang-seling warna hijau gelap agar terlihat kotak-kotak
                    ctx.fillStyle = ((i + j) % 2 === 0) ? "#1a3320" : "#204028";
                    ctx.fillRect(i * gridSize, j * gridSize, gridSize, gridSize);
                }
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Gunakan warna ular yang dipilih
                ctx.fillStyle = snakeColor;
                
                // Menggambar kotak dengan padding 1px agar terlihat terpisah-pisah
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);

                // Berikan tanda putih transparan pada kepala ular agar mudah dikenali
                if (index === 0) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fillRect(part.x + 6, part.y + 6, gridSize - 12, gridSize - 12);
                }
            });
        }

        function drawFood() {
            foods.forEach(food => {
                ctx.fillStyle = foodColor; // Warna apel disesuaikan dari picker
                ctx.beginPath();
                // Menggambar makanan berbentuk lingkaran agar lebih manis
                ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, 2 * Math.PI);
                ctx.fill();

                // Tambahan Unik: Detail daun kecil warna hijau di atas apel
                ctx.fillStyle = '#84cc16'; 
                ctx.beginPath();
                ctx.arc(food.x + gridSize/2, food.y + gridSize/2 - 6, 2, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        // --- Mekanik Pergerakan & Deteksi ---

        function advanceSnake() {
            // Membuat kepala baru berdasarkan arah gerak (dx, dy)
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Tambahkan kepala baru ke paling depan (indeks 0)
            snake.unshift(head);

            // Cek apakah ular makan SALAH SATU makanan yang ada di layar
            let ateFoodIndex = -1;
            for (let i = 0; i < foods.length; i++) {
                if (head.x === foods[i].x && head.y === foods[i].y) {
                    ateFoodIndex = i;
                    break;
                }
            }

            if (ateFoodIndex !== -1) {
                score += 10;
                document.getElementById('score').innerText = score;
                
                // Hapus apel spesifik yang baru saja dimakan
                foods.splice(ateFoodIndex, 1);
                
                generateFood(); // Hasilkan apel lagi
                
                // Sedikit percepat game setiap makan, batas maksimal 60ms
                if (gameSpeed > 60) {
                    gameSpeed -= 3;
                }
            } else {
                // Jika tidak makan, buang ekor belakang agar panjangnya tetap
                snake.pop();
            }
        }

        function generateFood() {
            // Rumus hitung apel: Skor 0=1 apel, Skor 50=2 apel, Skor 100=3 apel, dst.
            const expectedFoods = 1 + Math.floor(score / 50);
            
            // Tambahkan makanan sampai jumlah apel di layar sesuai dengan target
            while (foods.length < expectedFoods) {
                let newFoodX;
                let newFoodY;
                let isOnSnakeOrFood = true;

                // Cari lokasi acak yang tidak menabrak ular & tidak menabrak apel lain
                while (isOnSnakeOrFood) {
                    newFoodX = Math.round((Math.random() * (canvas.width - gridSize)) / gridSize) * gridSize;
                    newFoodY = Math.round((Math.random() * (canvas.height - gridSize)) / gridSize) * gridSize;
                    
                    isOnSnakeOrFood = false;

                    // Cek tabrakan dengan ular
                    for (let part of snake) {
                        if (part.x === newFoodX && part.y === newFoodY) {
                            isOnSnakeOrFood = true; break;
                        }
                    }

                    // Cek tabrakan dengan apel lain yang sudah ada
                    if (!isOnSnakeOrFood) {
                        for (let f of foods) {
                            if (f.x === newFoodX && f.y === newFoodY) {
                                isOnSnakeOrFood = true; break;
                            }
                        }
                    }
                }

                // Masukkan apel baru yang posisinya sudah aman ke array
                foods.push({ x: newFoodX, y: newFoodY });
            }
        }

        function hasGameEnded() {
            // Deteksi tabrakan dengan diri sendiri
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            // Deteksi tabrakan dengan tembok (keluar batas kanvas)
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // --- Sistem Kontrol Arah ---

        // Kontrol menggunakan sentuhan / tombol layar (Mobile)
        function setDirection(dir) {
            if (changingDirection) return;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            // Memastikan ular tidak bisa langsung mundur 180 derajat
            if (dir === 'LEFT' && !goingRight) { dx = -gridSize; dy = 0; changingDirection = true; }
            if (dir === 'UP' && !goingDown) { dx = 0; dy = -gridSize; changingDirection = true; }
            if (dir === 'RIGHT' && !goingLeft) { dx = gridSize; dy = 0; changingDirection = true; }
            if (dir === 'DOWN' && !goingUp) { dx = 0; dy = gridSize; changingDirection = true; }
        }

        // Kontrol menggunakan Keyboard (Desktop)
        document.addEventListener("keydown", function(event) {
            const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
            const A_KEY = 65, D_KEY = 68, W_KEY = 87, S_KEY = 83;
            
            const keyPressed = event.keyCode;
            
            if (keyPressed === LEFT_KEY || keyPressed === A_KEY) setDirection('LEFT');
            if (keyPressed === RIGHT_KEY || keyPressed === D_KEY) setDirection('RIGHT');
            if (keyPressed === UP_KEY || keyPressed === W_KEY) setDirection('UP');
            if (keyPressed === DOWN_KEY || keyPressed === S_KEY) setDirection('DOWN');
            
            // Cegah layar ikut scrolling ketika menekan tombol panah
            if([37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                event.preventDefault();
            }
        });

        // Cegah zoom/scroll ketika menekan tombol kontrol di HP
        document.getElementById('mobile-controls').addEventListener('touchstart', function(e) {
            e.preventDefault();
        }, {passive: false});

        // --- Sistem Kontrol Usap (Swipe) untuk Layar Sentuh ---
        let touchStartX = 0;
        let touchStartY = 0;
        const gameWrapper = document.getElementById('game-wrapper');

        // Mendeteksi awal sentuhan jari
        gameWrapper.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        // Mencegah layar terscroll saat jari mengusap
        gameWrapper.addEventListener('touchmove', function(e) {
            e.preventDefault(); 
        }, {passive: false});

        // Mendeteksi akhir sentuhan dan menghitung arah
        gameWrapper.addEventListener('touchend', function(e) {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        });

        function handleSwipe(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            
            // Jarak usapan minimal (threshold) agar tidak mendeteksi ketukan tidak sengaja
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    // Usap Horizontal
                    if (dx > 0) setDirection('RIGHT');
                    else setDirection('LEFT');
                } else {
                    // Usap Vertikal
                    if (dy > 0) setDirection('DOWN');
                    else setDirection('UP');
                }
            }
        }

    </script>
</body>
</html>
